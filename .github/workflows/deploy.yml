name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_GROUP_WEBHOOKS: ${{ secrets.GROUP_WEBHOOKS }}

      - name: Checkout corpus-explorer
        uses: actions/checkout@v4
        with:
          repository: bmmedinac/corpus-explorer
          path: corpus-explorer

      - name: Install corpus-explorer dependencies
        run: npm ci
        working-directory: corpus-explorer

      - name: Build corpus-explorer
        run: npm run build -- --base=/landing-page-odontobarrio/corpus/
        working-directory: corpus-explorer

      - name: Merge corpus-explorer into dist
        run: |
          mkdir -p dist/corpus
          cp -r corpus-explorer/dist/. dist/corpus/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
