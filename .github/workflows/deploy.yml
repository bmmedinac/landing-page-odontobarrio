name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_GROUP_WEBHOOKS: ${{ secrets.GROUP_WEBHOOKS }}

      # corpus-explorer se descarga como tarball por HTTPS plano (ni
      # actions/checkout ni git clone): el GITHUB_TOKEN de este workflow no
      # tiene permiso para consultar otros repos vía la API (lo que rompe
      # actions/checkout al resolver la rama por defecto), y por separado el
      # protocolo git en el runner intenta autenticar incluso repos públicos
      # y falla con "could not read Username for 'https://github.com'" pese a
      # limpiar el credential helper. Un curl + tar evita ambos problemas: es
      # una descarga HTTP anónima normal, sin protocolo git de por medio.
      - name: Download corpus-explorer
        id: checkout_corpus
        continue-on-error: true
        run: |
          curl -fsSL https://github.com/bmmedinac/corpus-explorer/archive/refs/heads/main.tar.gz -o corpus-explorer.tar.gz
          mkdir -p corpus-explorer
          tar -xzf corpus-explorer.tar.gz -C corpus-explorer --strip-components=1

      - name: Install corpus-explorer dependencies
        id: install_corpus
        if: steps.checkout_corpus.outcome == 'success'
        continue-on-error: true
        run: npm ci
        working-directory: corpus-explorer

      - name: Build corpus-explorer
        id: build_corpus
        if: steps.install_corpus.outcome == 'success'
        continue-on-error: true
        run: npm run build -- --base=/landing-page-odontobarrio/corpus/
        working-directory: corpus-explorer

      - name: Merge corpus-explorer into dist
        if: steps.build_corpus.outcome == 'success'
        run: |
          mkdir -p dist/corpus
          cp -r corpus-explorer/dist/. dist/corpus/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
