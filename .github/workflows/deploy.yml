name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_GROUP_WEBHOOKS: ${{ secrets.GROUP_WEBHOOKS }}

      # corpus-explorer se clona con git plano (no actions/checkout): el
      # GITHUB_TOKEN de este workflow no tiene permiso para consultar otros
      # repos vía la API, y actions/checkout lo necesita para resolver la
      # rama por defecto. git clone anónimo no pasa por esa API.
      - name: Checkout corpus-explorer
        id: checkout_corpus
        continue-on-error: true
        run: git clone --depth 1 https://github.com/bmmedinac/corpus-explorer corpus-explorer

      - name: Install corpus-explorer dependencies
        id: install_corpus
        if: steps.checkout_corpus.outcome == 'success'
        continue-on-error: true
        run: npm ci
        working-directory: corpus-explorer

      - name: Build corpus-explorer
        id: build_corpus
        if: steps.install_corpus.outcome == 'success'
        continue-on-error: true
        run: npm run build -- --base=/landing-page-odontobarrio/corpus/
        working-directory: corpus-explorer

      - name: Merge corpus-explorer into dist
        if: steps.build_corpus.outcome == 'success'
        run: |
          mkdir -p dist/corpus
          cp -r corpus-explorer/dist/. dist/corpus/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
