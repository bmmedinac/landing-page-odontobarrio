name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # corpus-explorer vive en otro repo y este workflow siempre clona su main
  # más reciente al buildear, pero solo corría con push a ESTE repo — un
  # merge en corpus-explorer no republicaba nada. Su propio workflow
  # (.github/workflows/notify-landing-deploy.yml) dispara este evento al
  # mergear a su main.
  repository_dispatch:
    types: [corpus-explorer-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_GROUP_WEBHOOKS: ${{ secrets.GROUP_WEBHOOKS }}

      # corpus-explorer es un repo privado, así que el GITHUB_TOKEN de este
      # workflow (limitado a este repo) no puede leerlo: hay que pasarle un
      # token propio con permiso de lectura sobre corpus-explorer, guardado
      # como el secreto CORPUS_EXPLORER_TOKEN. Si el secreto falta o caduca,
      # este paso falla y solo se omite la publicación de /corpus/ — el
      # deploy de la landing sigue adelante.
      - name: Checkout corpus-explorer
        id: checkout_corpus
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: bmmedinac/corpus-explorer
          token: ${{ secrets.CORPUS_EXPLORER_TOKEN }}
          path: corpus-explorer

      - name: Install corpus-explorer dependencies
        id: install_corpus
        if: steps.checkout_corpus.outcome == 'success'
        continue-on-error: true
        run: npm ci
        working-directory: corpus-explorer

      - name: Build corpus-explorer
        id: build_corpus
        if: steps.install_corpus.outcome == 'success'
        continue-on-error: true
        run: npm run build -- --base=/landing-page-odontobarrio/corpus/
        working-directory: corpus-explorer

      - name: Merge corpus-explorer into dist
        if: steps.build_corpus.outcome == 'success'
        run: |
          mkdir -p dist/corpus
          cp -r corpus-explorer/dist/. dist/corpus/

      # prompt-diff-viewer es un repo privado, mismo motivo y mismo patrón que
      # corpus-explorer arriba: token propio (PROMPT_DIFF_VIEWER_TOKEN) porque
      # el GITHUB_TOKEN de este workflow no puede leer otro repo privado. Si el
      # secreto falta o el build falla, solo se omite /diffs/ — el resto del
      # deploy sigue.
      - name: Checkout prompt-diff-viewer
        id: checkout_diffs
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: bmmedinac/prompt-diff-viewer
          token: ${{ secrets.PROMPT_DIFF_VIEWER_TOKEN }}
          path: prompt-diff-viewer

      - name: Install prompt-diff-viewer dependencies
        id: install_diffs
        if: steps.checkout_diffs.outcome == 'success'
        continue-on-error: true
        run: pnpm install --frozen-lockfile
        working-directory: prompt-diff-viewer

      # OJO: a diferencia de npm ("npm run build -- --base=..."), pnpm
      # duplica el separador "--" al reenviar args a un script encadenado
      # (tsc -b && vite build), y Vite termina ignorando el --base. Por eso
      # acá se invoca "vite build" directo con pnpm exec en vez de pasar por
      # el script "build" de package.json.
      - name: Build prompt-diff-viewer
        id: build_diffs
        if: steps.install_diffs.outcome == 'success'
        continue-on-error: true
        run: pnpm exec tsc -b && pnpm exec vite build --base=/landing-page-odontobarrio/diffs/
        working-directory: prompt-diff-viewer

      - name: Merge prompt-diff-viewer into dist
        if: steps.build_diffs.outcome == 'success'
        run: |
          mkdir -p dist/diffs
          cp -r prompt-diff-viewer/dist/. dist/diffs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
